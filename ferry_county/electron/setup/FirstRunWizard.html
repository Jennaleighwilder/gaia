<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'"
    />
    <title>Ferry County Field System — Setup</title>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #0e1e0e;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        background: #1e3d1e;
        border-radius: 12px;
        padding: 2rem;
        width: 480px;
        border: 1px solid #2e5f2e;
        box-sizing: border-box;
      }
      h1 {
        color: #c94f08;
        font-size: 20px;
        margin-bottom: 0.5rem;
      }
      h2 {
        color: #aaa;
        font-size: 14px;
        font-weight: normal;
        margin-bottom: 2rem;
      }
      label {
        display: block;
        font-size: 13px;
        color: #ccc;
        margin-bottom: 4px;
        margin-top: 1rem;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #2e5f2e;
        background: #0e1e0e;
        color: #fff;
        font-size: 13px;
        box-sizing: border-box;
      }
      input:focus {
        outline: none;
        border-color: #c94f08;
      }
      button {
        margin-top: 1.5rem;
        width: 100%;
        padding: 10px;
        background: #c94f08;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        font-weight: bold;
      }
      button:hover {
        background: #e06020;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .status {
        margin-top: 1rem;
        font-size: 12px;
        color: #aaa;
        min-height: 20px;
      }
      .error {
        color: #ff6b6b;
      }
      .success {
        color: #4caf50;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Ferry County Field System</h1>
      <h2>First-time setup — PostgreSQL connection (PostGIS-enabled database)</h2>

      <label for="db-host">Database host</label>
      <input type="text" id="db-host" value="127.0.0.1" placeholder="127.0.0.1" autocomplete="off" />

      <label for="db-port">Database port</label>
      <input type="text" id="db-port" value="5432" placeholder="5432" autocomplete="off" />

      <label for="db-name">Database name</label>
      <input type="text" id="db-name" value="ferry_county" placeholder="ferry_county" autocomplete="off" />

      <label for="db-user">Database username</label>
      <input type="text" id="db-user" value="ferry" placeholder="ferry" autocomplete="off" />

      <label for="db-pass">Database password</label>
      <input type="password" id="db-pass" value="" placeholder="" autocomplete="new-password" />

      <button type="button" id="btn-go">Test connection and continue</button>
      <div class="status" id="status"></div>
    </div>

    <script>
      const statusEl = document.getElementById("status");
      const btn = document.getElementById("btn-go");

      async function testAndSave() {
        const host = document.getElementById("db-host").value.trim();
        const port = document.getElementById("db-port").value.trim();
        const name = document.getElementById("db-name").value.trim();
        const user = document.getElementById("db-user").value.trim();
        const pass = document.getElementById("db-pass").value;

        const url =
          "postgresql+psycopg2://" +
          encodeURIComponent(user) +
          ":" +
          encodeURIComponent(pass) +
          "@" +
          host +
          ":" +
          port +
          "/" +
          encodeURIComponent(name);

        statusEl.textContent = "Testing connection…";
        statusEl.className = "status";
        btn.disabled = true;

        const result = await window.ferryShell.testDatabase(url);
        if (result.ok) {
          statusEl.textContent = "Connected. Starting system…";
          statusEl.className = "status success";
          await window.ferryShell.saveConfig({ database_url: url });
          await window.ferryShell.continueSetup();
        } else {
          statusEl.textContent = "Connection failed: " + (result.error || "unknown");
          statusEl.className = "status error";
        }
        btn.disabled = false;
      }

      btn.addEventListener("click", () => testAndSave());
    </script>
  </body>
</html>
