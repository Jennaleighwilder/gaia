services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: ferry
      POSTGRES_PASSWORD: ferry
      POSTGRES_DB: ferry
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferry -d ferry"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Full stack: `docker compose --profile stack up -d --build` → http://localhost:8080
  api:
    profiles: ["stack"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://ferry:ferry@db:5432/ferry
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173
      ATTACHMENT_STORAGE_DIR: /data/ferry_attachments
    ports:
      - "8090:8090"
    volumes:
      - ferry_attachments:/data/ferry_attachments
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ["stack"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  ferry_attachments:
